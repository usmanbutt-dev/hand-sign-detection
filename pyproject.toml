[project]
name = "hand-sign-detection"
version = "0.1.0"
description = "Real-time ASL hand sign detection using YOLO26 + MediaPipe Tasks API + PyTorch Transformer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core ML
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "ultralytics>=8.4.0",      # YOLO26 ships via ultralytics package
    "mediapipe>=0.10.14",       # Includes Tasks API (HandLandmarker)
    # Vision & Video
    "opencv-python>=4.10.0",
    "Pillow>=10.4.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",  # FastAPI file upload
    # UI
    "streamlit>=1.39.0",
    # Experiment tracking
    "mlflow>=2.16.0",
    # Data & Utils
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.66.0",
    "albumentations>=1.4.0",    # Fast image augmentation
    "matplotlib>=3.9.0",        # Plotting for notebooks
    "kaggle>=2.2.0",            # Dataset download CLI
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, isort
ignore = ["E501"]               # line length handled separately

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
