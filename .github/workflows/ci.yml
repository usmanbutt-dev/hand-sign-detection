name: CI

on:
  push:
    branches: ["**"]       # Run on every branch push
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment & install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          # Install only lightweight deps for CI (skip torch/opencv/mediapipe/ultralytics)
          uv pip install pyyaml pytest pytest-cov ruff

      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ --cov=src --cov-report=term-missing -v
